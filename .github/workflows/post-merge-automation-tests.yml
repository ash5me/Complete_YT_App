name: Post-merge Selenium automation tests

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  selenium-testng:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build application
        run: mvn --batch-mode -DskipTests package

      - name: Start Spring Boot
        run: |
          nohup java -jar target/mytube-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Application is ready."
              exit 0
            fi

            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              exit 1
            fi

            sleep 2
          done

          echo "Application did not start in time."
          cat app.log
          exit 1

      - name: Run Selenium TestNG suite
        run: |
          mvn --batch-mode \
            -Dheadless=true \
            -DbaseUrl=http://localhost:8080/ \
            -DfailIfNoTests=true \
            test

      - name: Verify all 29 tests were discovered
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/surefire-reports/testng-results.xml")
          if not report.is_file():
              sys.exit("TestNG results report is missing; TestNG may not have run.")

          root = ET.parse(report).getroot()
          total = int(root.attrib.get("total", "0"))
          passed = int(root.attrib.get("passed", "0"))
          failed = int(root.attrib.get("failed", "0"))
          skipped = int(root.attrib.get("skipped", "0"))

          print(f"TestNG totals: total={total}, passed={passed}, failed={failed}, skipped={skipped}")

          if total != 29:
              sys.exit(f"Expected exactly 29 TestNG test methods, but found {total}.")
          if failed != 0:
              sys.exit(f"{failed} TestNG test(s) failed.")
          PY

      - name: Show application logs on failure
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: |
            target/surefire-reports/
            test-output/
            app.log
          if-no-files-found: warn
          retention-days: 14

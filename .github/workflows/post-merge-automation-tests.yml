
name: Post-merge Selenium automation tests

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  selenium-testng:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build application
        run: mvn --batch-mode -DskipTests package

      - name: Start Spring Boot
        run: |
          nohup java -jar target/mytube-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Application is ready."
              exit 0
            fi

            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              exit 1
            fi

            sleep 2
          done

          echo "Application did not start in time."
          cat app.log
          exit 1

      - name: Run Selenium TestNG suite
        run: |
          mvn --batch-mode \
            -Dheadless=true \
            -DbaseUrl=http://localhost:8080/ \
            -Dsurefire.suiteXmlFiles=src/test/java/automation/testng.xml \
            test

      - name: Verify tests were executed
        run: |
          if [ ! -f target/surefire-reports/testng-results.xml ]; then
            echo "TestNG report was not generated."
            exit 1
          fi

          TEST_COUNT=$(grep -oP 'total="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1)

          echo "TestNG tests executed: ${TEST_COUNT:-0}"

          if [ -z "$TEST_COUNT" ] || [ "$TEST_COUNT" -eq 0 ]; then
            echo "No TestNG tests were executed."
            exit 1
          fi

      - name: Show application logs on failure
        if: failure()
        run: cat app.log

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: |
            target/surefire-reports/
            test-output/
          if-no-files-found: warn
          retention-days: 14
